# Nginx конфигурация для Автошколы СТАРТ
# Скопировать в /etc/nginx/sites-available/start-avtoshkola
# Затем: sudo ln -s /etc/nginx/sites-available/start-avtoshkola /etc/nginx/sites-enabled/
# Затем: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name start-avtoshkola.kz www.start-avtoshkola.kz;

    # Перенаправление на HTTPS (раскомментировать после настройки SSL)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}

